<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USA 2026 Planner</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7" id="theme-meta">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
</head>
<body class="light-mode theme-home">

    <div id="offline-banner">✈️ Offline Mode.</div>
    <div id="ptr-spinner"><div class="sync-plane">✈️</div><div id="sync-text">Syncing...</div></div>

    <div id="splash" class="active">
        <div class="splash-container">
            <div class="splash-card">
                <img src="img/logo.png" alt="USA 2026" class="splash-logo">
                <h1 class="splash-title">USA 2026</h1>
                <div id="login-controls">
                    <select id="login-selector" class="settings-input">
                        <option value="" disabled selected>Who are you?</option>
                        <optgroup label="Leech Family"><option value="Graeme">Graeme</option><option value="Dawn">Dawn</option><option value="Grace">Grace</option></optgroup>
                        <optgroup label="Murray Family"><option value="David">David</option><option value="Sarah">Sarah</option><option value="Bexs">Bexs</option></optgroup>
                    </select>
                </div>
                <button id="splash-go-btn" class="action-btn pulse-btn" style="display: none;">Let's go!</button>
            </div>
        </div>
    </div>

    <main id="content">
        <section id="home" class="page tab-content active">
            <div id="dashboard-hero" class="sky-day">
                <h2 id="greeting-title">Good Morning!</h2>
                <div id="countdown-display" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <div class="flap-board"><span class="flap" id="cd-num">--</span></div>
                    <span style="font-size: 24px; font-weight: 900;">Days!</span>
                </div>
                <div id="up-next-title" style="text-align:center; font-weight:900; margin-top:20px;">Loading plans...</div>
            </div>

            <div id="home-weather-pill" class="weather-pill-multi">
                <div class="w-col"><span>LA</span><div id="wp-la">--</div></div>
                <div class="w-col"><span>Utah</span><div id="wp-utah">--</div></div>
                <div class="w-col"><span>Vegas</span><div id="wp-vegas">--</div></div>
            </div>

            <button id="btn-manual-briefing" class="action-btn">☕ Morning Briefing</button>
            <button id="btn-open-checklist" class="action-btn">📋 Checklist</button>
            <button id="btn-open-admin" class="action-btn">⚙️ Settings</button>
        </section>

        <section id="la" class="page tab-content">
            <div class="city-hero" style="background-image: url('img/la.jpg')"><h2>Los Angeles</h2></div>
            <div id="la-itinerary"></div>
        </section>
        <section id="utah" class="page tab-content">
            <div class="city-hero" style="background-image: url('img/utah.jpg')"><h2>Utah</h2></div>
            <div id="utah-itinerary"></div>
        </section>
        <section id="vegas" class="page tab-content">
            <div class="city-hero" style="background-image: url('img/vegas.jpg')"><h2>Las Vegas</h2></div>
            <div id="vegas-itinerary"></div>
        </section>
        <section id="flights" class="page tab-content">
            <div class="city-hero" style="background-image: url('img/flights.jpg')"><h2>Travel</h2></div>
            <div id="flights-vault-display"></div>
        </section>
        
        <section id="admin" class="page tab-content">
            <h2>Settings</h2>
            <div class="admin-card">
                <h3>Default Name</h3>
                <select id="family-selector" class="settings-input"></select>
            </div>
            <button id="btn-force-sync" class="action-btn">☁️ Sync Now</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <button id="nav-btn-la" class="nav-btn">🌴</button>
        <button id="nav-btn-utah" class="nav-btn">⛰️</button>
        <button id="nav-btn-home" class="nav-btn active">🏠</button>
        <button id="nav-btn-vegas" class="nav-btn">🎲</button>
        <button id="nav-btn-flights" class="nav-btn">✈️</button>
    </nav>

    <div id="briefing-modal" class="modal-overlay">
        <div class="modal-content admin-card">
            <h2 id="briefing-title-modal">Good Morning!</h2>
            <div id="briefing-itin"></div>
            <button id="btn-close-briefing" class="action-btn">Let's Go!</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
