<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Holiday Planner 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7" id="theme-meta">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="style.css?v=2.1.59">
</head>
<body class="light-mode theme-home">

    <div id="offline-banner">✈️ Offline Mode.</div>
    <div id="ptr-spinner">↻ Syncing...</div>
    <div id="hype-toast" style="display:none; position:fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 15px 25px; border-radius: 20px; z-index: 10000; font-weight: 900; text-align: center; backdrop-filter: blur(10px);"></div>

    <div id="splash">
        <div class="splash-container">
            <div class="splash-card">
                <img src="img/logo.png" alt="USA 2026" class="splash-logo">
                
                <div class="floating-icons">
                    <span class="icon la-icon">🌴</span>
                    <span class="icon utah-icon">⛰️</span>
                    <span class="icon vegas-icon">🎲</span>
                </div>
                
                <h1 class="splash-title">USA 2026</h1>
                
                <select id="login-selector" class="settings-input" style="margin-bottom: 20px; text-align: center; text-align-last: center;">
                    <option value="" disabled selected>Who is logging in?</option>
                    <optgroup label="Leech Family">
                        <option value="Graeme">Graeme</option>
                        <option value="Dawn">Dawn</option>
                        <option value="Grace">Grace</option>
                    </optgroup>
                    <optgroup label="Murray Family">
                        <option value="David">David</option>
                        <option value="Sarah">Sarah</option>
                        <option value="Bexs">Bexs</option>
                    </optgroup>
                </select>
                <button id="splash-go-btn" class="action-btn pulse-btn" style="display: none; box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);">Let's go!</button>
            </div>
        </div>
    </div>

    <main id="content">
        <section id="la" class="page tab-content">
            <div id="hero-la" class="city-hero" style="background-image: url('img/la.jpg'); cursor: pointer;">
                <h2>Los Angeles<span id="time-la" style="display:block; font-size:16px; font-weight:800; opacity:0.9; margin-top:4px; text-transform: uppercase; letter-spacing: 1px;">🕒 --:--</span></h2>
            </div>
            <button class="action-btn tips-btn" data-city="la" style="margin-bottom: 24px; background: var(--card); color: var(--accent); border: 2px solid var(--accent); box-shadow: 0 6px 20px var(--shadow); font-weight: 900;">💡 LA Top Tips</button>
            <div id="la-home-card"></div>
            <div id="la-itinerary"><div class="skel-card"><div class="skeleton skel-h"></div><div class="skeleton skel-p"></div></div></div> 
            <div id="la-completed-section" class="completed-section" style="display: none;"><div class="completed-divider"><span>✅ Completed</span></div><div id="la-completed-list"></div></div>
        </section>

        <section id="utah" class="page tab-content">
            <div id="hero-utah" class="city-hero" style="background-image: url('img/utah.jpg'); cursor: pointer;">
                <h2>Utah<span id="time-utah" style="display:block; font-size:16px; font-weight:800; opacity:0.9; margin-top:4px; text-transform: uppercase; letter-spacing: 1px;">🕒 --:--</span></h2>
            </div>
            <button class="action-btn tips-btn" data-city="utah" style="margin-bottom: 24px; background: var(--card); color: var(--accent); border: 2px solid var(--accent); box-shadow: 0 6px 20px var(--shadow); font-weight: 900;">💡 Utah Top Tips</button>
            <div id="utah-home-card"></div>
            <div id="utah-itinerary"><div class="skel-card"><div class="skeleton skel-h"></div><div class="skeleton skel-p"></div></div></div>
            <div id="utah-completed-section" class="completed-section" style="display: none;"><div class="completed-divider"><span>✅ Completed</span></div><div id="utah-completed-list"></div></div>
        </section>

        <section id="home" class="page tab-content active">
            <div style="background: linear-gradient(135deg, #ff2d55, #ff9500); border-radius: 24px; padding: 30px 20px; color: white; text-align: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: 2px;">USA 2026</h2>
                <div style="font-size: 15px; font-weight: 800; opacity: 0.9;">Road Trip Dashboard</div>
            </div>
            
            <div id="time-engine" style="margin-bottom: 20px;">
                <div id="countdown-display" style="display: none; background: linear-gradient(135deg, #ff3b30, #d0021b); color: white; padding: 24px 20px; border-radius: 24px; text-align: center;">
                    <div id="cd-text" style="font-size: 28px; font-weight: 900; margin-bottom: 10px;">-- Days!</div>
                    <div id="cd-date" style="font-size: 14px; opacity: 0.9; background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 12px; display: inline-block;">...</div>
                </div>
                <div id="dual-clocks" style="display: none; background: var(--card); border-radius: 24px; padding: 24px 20px; box-shadow: 0 8px 24px var(--shadow);">
                    <div style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px;">
                        <div><div style="font-size: 12px; font-weight: 800; opacity: 0.5;">🇬🇧 UK</div><div id="clock-uk" style="font-size: 32px; font-weight: 900; color: var(--accent);">--:--</div></div>
                        <div style="width: 2px; background: var(--ios-grey);"></div>
                        <div><div id="local-tz-label" style="font-size: 12px; font-weight: 800; opacity: 0.5;">🇺🇸 LOCAL</div><div id="clock-local" style="font-size: 32px; font-weight: 900;">--:--</div></div>
                    </div>
                </div>
            </div>

            <div id="home-weather-pill" class="weather-pill-multi">
                <div class="w-col"><span class="w-lbl">Local</span><div class="w-val" id="wp-local">⏳</div></div>
                <div class="w-pipe"></div>
                <div class="w-col"><span class="w-lbl">LA</span><div class="w-val" id="wp-la">⏳</div></div>
                <div class="w-pipe"></div>
                <div class="w-col"><span class="w-lbl">Utah</span><div class="w-val" id="wp-utah">⏳</div></div>
                <div class="w-pipe"></div>
                <div class="w-col"><span class="w-lbl">Vegas</span><div class="w-val" id="wp-vegas">⏳</div></div>
            </div>

            <div class="admin-card color-card" style="padding: 20px; margin-bottom: 20px; background: linear-gradient(135deg, #34c759, #28a745); box-shadow: 0 8px 24px rgba(52, 199, 89, 0.3);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <div style="font-size: 11px; font-weight: 900; text-transform: uppercase;">Converter</div>
                    <div id="live-rate-tag" style="font-size: 9px; font-weight: 900; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 8px;">£1 = $--.--</div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="number" id="usd-input" placeholder="$ USD" style="padding: 12px; width: 100px; font-size: 18px; font-weight: 800; background: rgba(0,0,0,0.2); border-radius: 12px; border: none; color: white; outline: none;">
                    <span style="font-weight: 900;">=</span>
                    <strong id="gbp-output" style="font-size: 20px; font-weight: 900; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 12px; min-width: 70px;">£0.00</strong>
                </div>
            </div>

            <div class="admin-card color-card" style="margin-bottom: 20px; background: linear-gradient(135deg, #ff9500, #e67e22); box-shadow: 0 8px 24px rgba(255, 149, 0, 0.3);">
                <div style="font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px;">🍽️ Tip & Split</div>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="number" id="bill-total" placeholder="Bill $" style="padding: 14px 10px; font-size: 18px; width: 60%; border-radius: 12px; border: none; background: rgba(0,0,0,0.2); color: white; outline: none;">
                    <select id="split-ways" style="padding: 14px 10px; font-size: 16px; font-weight: 800; width: 40%; border-radius: 12px; border: none; background: rgba(0,0,0,0.2); color: white; outline: none;">
                        <option value="1" style="color: black;">1 Fam</option><option value="2" selected style="color: black;">2 Fams</option>
                    </select>
                </div>
                <div class="theme-segmented-control" style="background: rgba(0,0,0,0.2); margin-bottom: 15px;">
                    <button class="segment tip-btn" data-tip="15">15%</button><button class="segment tip-btn active" data-tip="18">18%</button><button class="segment tip-btn" data-tip="20">20%</button>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 16px; display: flex; justify-content: space-between;">
                    <div><div style="font-size: 10px; opacity: 0.8; font-weight: 800;">Per Fam ($)</div><div id="tip-usd" style="font-size: 24px; font-weight: 900;">$0.00</div></div>
                    <div style="text-align: right;"><div style="font-size: 10px; opacity: 0.8; font-weight: 800;">In GBP</div><div id="tip-gbp" style="font-size: 24px; font-weight: 900;">£0.00</div></div>
                </div>
            </div>

            <div class="admin-card color-card" style="margin-bottom: 30px; text-align: center; background: linear-gradient(135deg, #af52de, #5e5ce6); box-shadow: 0 8px 2
